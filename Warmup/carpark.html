<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escape the Car Park</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Start screen -->
  <section id="start-screen" class="screen">
    <div class="top-bar"><a class="link-btn" href="index.html">← All games</a></div>
    <div class="intro">
      <h1>Escape the Car Park</h1>
      <p class="tagline">Slide the cars out of the way and drive out through the exit.</p>
      <svg id="park-hero" class="park-svg hero" viewBox="0 0 452 388" aria-hidden="true"></svg>
      <button id="start-btn" class="btn primary big">Start</button>
      <div class="rules">
        <p>Cars only move forwards and backwards.</p>
        <p>Each slide is one move, however far it goes.</p>
        <p>Fewer moves and a faster time earn more stars.</p>
      </div>
    </div>
  </section>

  <!-- Game screen -->
  <section id="game-screen" class="screen hidden">
    <div class="top-bar"><button id="back-btn" class="link-btn">← All games</button></div>
    <p id="instructions"></p>
    <div id="level-info"></div>
    <div id="status"></div>

    <svg id="park-board" class="park-svg" viewBox="0 0 452 388"></svg>

    <div id="result"></div>
    <div class="buttons">
      <button id="undo-btn" class="btn">Undo</button>
      <button id="restart-btn" class="btn">Start over</button>
      <button id="new-btn" class="btn hidden">New car park</button>
      <button id="next-btn" class="btn primary hidden">Next level</button>
      <button id="summary-btn" class="btn primary hidden">See summary</button>
    </div>
  </section>

  <!-- Run summary -->
  <section id="summary-screen" class="screen hidden">
    <h2 class="summary-title">Run complete</h2>
    <div id="summary-total"></div>
    <table id="summary-table"></table>
    <div class="buttons">
      <button id="home-btn" class="btn">All games</button>
      <button id="again-btn" class="btn primary">Play again</button>
    </div>
  </section>

  <script src="js/carpark.js"></script>
</body>
</html>
